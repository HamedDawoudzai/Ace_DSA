# Ace DSA - local dev stack (backend + Postgres)
# From repo root: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acedsa
      POSTGRES_PASSWORD: acedsa
      POSTGRES_DB: acedsa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acedsa -d acedsa"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_URL: "postgres://acedsa:acedsa@postgres:5432/acedsa?sslmode=disable"
      JWT_SECRET: "dev-secret-min-32-chars-for-jwt-signing"
      DEV_BACKDOOR_PASSWORD: "dev123"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
